AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Demo TFC StepFunctions e Lambda com triagem de COVID-19
Globals:
  Function:
    MemorySize: 128
    Timeout: 15
    Runtime: python3.7

Parameters:
  MyEnvironment: 
    Type: String
    Default: dev
    AllowedValues: 
      - dev
      - prod

Mappings:
  ResourcesName:
    dev:
      tableName: covid_MyDyname-dev
    prod:
      tableName: covid_MyDyname-prod

Resources:
  SQSQueueLegacyBooking:
    Type: AWS::SQS::Queue

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
  TriagemFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: triagem.handler
      CodeUri: procedimento-clinico/

  AgendarConsultaFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: agendamento.handler
      Description: ''
      CodeUri: marcar-consulta/
      Events:
        MySQSEvent:
          Type: SQS
          Properties:
            Queue: 
              'Fn::GetAtt': SQSQueueLegacyBooking.Arn
            BatchSize: 10
        APIEvent:
          Type: Api
          Properties:
            Path: '/agendamento'
            Method: get
            RestApiId:
              Ref: ApiGateway
      Policies:
        - DynamoDBReadPolicy:
            TableName: 
              Ref: MedicalBookingTable

  MedicalRecordTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName:
        'Fn::Sub': 'covid_MedicalRecord'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: temperatura
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: temperatura
          KeySchema:
            - AttributeName: temperatura
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MedicalBookingTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName:
        'Fn::FindInMap': [ResourcesName, !Ref MyEnvironment, tableName]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: temperatura
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: temperatura
          KeySchema:
            - AttributeName: temperatura
              KeyType: HASH
          Projection:
            ProjectionType: ALL
            
  CovidStateMachine:
    Type: 'AWS::Serverless::StateMachine'
    Properties:
      DefinitionUri: statemachine/covid19-workflow.asl.json
      Events:
        HttpPost:
          Type: Api
          Properties:
            Path: '/triagem'
            Method: post
            RestApiId:
              Ref: ApiGateway
      DefinitionSubstitutions:
        TriagemFunctionArn:
          'Fn::GetAtt':
            - TriagemFunction
            - Arn
        SQSQueueLegacyBookingURL:
            'Ref': SQSQueueLegacyBooking
      Policies:
        - LambdaInvokePolicy:
            FunctionName:
              Ref: TriagemFunction
        - DynamoDBCrudPolicy:
            TableName:
              Ref: MedicalRecordTable
        - SQSSendMessagePolicy:
            QueueName:
              'Fn::GetAtt': SQSQueueLegacyBooking.QueueName
        - SQSPollerPolicy:
            QueueName:
              'Fn::GetAtt': SQSQueueLegacyBooking.QueueName

Outputs:
  TriagemFunctionArn:
    Description: TriagemFunction Application ARN
    Value:
      'Fn::GetAtt':
        - TriagemFunction
        - Arn

  SQSQueueLegacyBookingURL:
    Value:
      'Ref': SQSQueueLegacyBooking
        
  SQSQueueLegacyBookingArn:
    Value:
      'Fn::GetAtt':
        - SQSQueueLegacyBooking
        - Arn
 
  CovidStateMachineArn:
    Value:
      'Fn::GetAtt':
        - CovidStateMachine
        - Arn
