AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Demo TFC StepFunctions e Lambda com triagem de COVID-19
Globals:
  Function:
    MemorySize: 128
    Timeout: 15
    Runtime: python3.7

Parameters:
  MyEnvironment: 
    Type: String
    Default: dev
    AllowedValues: 
      - dev
      - prod

Mappings:
  ResourcesName:
    dev:
      tableName: covid_MyDyname-dev
    prod:
      tableName: covid_MyDyname-prod

Resources:
  TriagemFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: triagem.handler
      CodeUri: procedimento-clinico/

  AgendarConsultaFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: agendamento.handler
      Description: ''
      CodeUri: marcar-consulta/
      Policies:
        - DynamoDBReadPolicy:
            TableName: 
              Ref: MedicalBookingTable

  MedicalRecordTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName:
        'Fn::Sub': 'covid_MedicalRecord'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: temperatura
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: temperatura
          KeySchema:
            - AttributeName: temperatura
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MedicalBookingTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName:
        'Fn::FindInMap': [ResourcesName, !Ref MyEnvironment, tableName]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: temperatura
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: temperatura
          KeySchema:
            - AttributeName: temperatura
              KeyType: HASH
          Projection:
            ProjectionType: ALL
            
  CovidStateMachine:
    Type: 'AWS::Serverless::StateMachine'
    Properties:
      DefinitionUri: statemachine/covid19-workflow.asl.json
      DefinitionSubstitutions:
        TriagemFunctionArn:
          'Fn::GetAtt':
            - TriagemFunction
            - Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName:
              Ref: TriagemFunction
        - DynamoDBCrudPolicy:
            TableName:
              Ref: MedicalRecordTable

Outputs:
  TriagemFunctionArn:
    Description: TriagemFunction Application ARN
    Value:
      'Fn::GetAtt':
        - TriagemFunction
        - Arn
        
  CovidStateMachineArn:
    Value:
      'Fn::GetAtt':
        - CovidStateMachine
        - Arn
